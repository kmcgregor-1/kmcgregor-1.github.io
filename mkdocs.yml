# Change to your own name
site_name: Kyle McGregor
# Change to your own site
site_url: https://kmcgregor-1.github.io/ # must have the trailing slash
site_author: Kyle McGregor (kyle.mcgregor@mail.mcgill.ca)
site_description: Kyle McGregor is a PhD student studying fast radio bursts and astrostatistics at McGill University.
copyright: > # should remain a link to the original theme
  &copy; 2026 Kyle McGregor <br>
  <a href="https://github.com/vuquangtrong/mkdocs-material-blog">Blog Theme</a> /
  <a href="https://squidfunk.github.io/mkdocs-material/">Material for MkDocs</a>

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kmcgregor-1
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/kmcgreg/
  analytics:
    provider: google
    property: G-FD41F9J8GQ # Add your Google Analytics ID

theme:
    name: material
    palette:
      # Palette toggle for light mode
      - scheme: default
        # Color of the top bar
        primary: indigo
        # Link highlight color
        accent : cyan
        
        toggle:
          icon: material/brightness-7 
          name: Switch to dark mode

      # Palette toggle for dark mode
      - scheme: slate
        toggle:
          icon: material/brightness-4
          name: Switch to light mode

    features:
    - navigation.instant # some features may not work properly with XHR
    - navigation.tracking # the URL changes with the active anchor
    - navigation.sections # sections are rendered as groups in the sidebar
    - navigation.expand # all sections are expanded
    - navigation.indexes # link an index.md page to a section
    - navigation.top # show back-to-top button
    - content.code.annotate 
    - content.code.copy

extra_javascript:
  
  # For rendering latex
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css


# For describing the navigation panel
nav: #relative to the docs folder
  - Home: index.md
  - About me: about/index.md
  - Research & Publications: research/index.md
  - Projects: projects/index.md
  - Fun stuff: astrophotography/index.md

# Extensions that we want to use
markdown_extensions:
  - attr_list   # For adding attributes such as right/left align to images
  - md_in_html  # Using Figures



# Additional plugins
plugins:
    - search
    # Using jupyter notebook  
    - mkdocs-jupyter:
          theme: default
